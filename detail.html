<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork Detail | Monochromatic Realism</title>
    <style>
        body { background-color: #7a5b5b; color: #faf6f6; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .page-container { background-color: #ffffff; max-width: 1000px; width: 100%; padding: 60px 40px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #d0d0d0; box-sizing: border-box; }

        .logo-top { text-align: center; margin-bottom: 8px; }
        .logo-placeholder { display: inline-flex; align-items: center; justify-content: center; width: 55px; height: 55px; }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .logo-top .studio-tagline { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #aaaaaa; margin-top: 4px; margin-bottom: 30px; }

        .top-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .top-links a { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #888888; text-decoration: none; transition: color 0.3s ease; }
        .top-links a:hover { color: #333333; }

        .artwork-display { text-align: center; margin-bottom: 50px; }
        .art-frame { background-color: #e8e8e8; padding: 12px; border: 1px solid #bbbbbb; max-width: 450px; margin: 0 auto 20px; box-sizing: border-box; }
        .art-frame img { width: 100%; height: auto; display: block; filter: grayscale(100%); }
        .artwork-title { font-size: 20px; font-weight: 300; letter-spacing: 2px; color: #111111; margin: 0 0 5px 0; font-style: italic; }
        .artwork-number { font-size: 11px; letter-spacing: 3px; color: #888888; text-transform: uppercase; display: block; margin-bottom: 30px; }

        .description-section { padding-top: 30px; max-width: 500px; margin: 0 auto; text-align: center; }
        .description-section h2 { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #333333; margin-bottom: 20px; }
        .description-section p { font-size: 15px; line-height: 1.8; color: #4a4a4a; text-align: justify; margin-bottom: 20px; }
        .description-section .medium { font-size: 13px; color: #777777; font-style: italic; }

        .purchase-btn { display: inline-block; margin-top: 25px; padding: 12px 30px; background-color: #25D366; color: #ffffff; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; transition: background-color 0.3s ease; }
        .purchase-btn:hover { background-color: #1da851; }

        .nav-links { display: flex; justify-content: space-between; align-items: center; max-width: 500px; margin: 40px auto 0; padding-top: 25px; }
        .nav-links a { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #888888; text-decoration: none; }
        .nav-links a:hover { color: #333333; }

        .footer { text-align: center; font-size: 10px; color: #888888; margin-top: 40px; letter-spacing: 1px; }

        @media (max-width: 600px) {
            .page-container { padding: 30px 15px; }
            .art-frame { max-width: 100%; }
            .artwork-title { font-size: 18px; }
            .nav-links { flex-direction: column; gap: 15px; }
            .top-links { flex-direction: column; gap: 10px; text-align: center; }
            .description-section p { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="page-container">

        <div class="logo-top">
            <div class="logo-placeholder"><img src="logo.jpg" alt="Studio Mark"></div>
            <div class="studio-tagline">The Studio</div>
        </div>

        <div class="top-links">
            <a href="gallery.html">← Back to Gallery</a>
            <a href="home_page.html">Back to Home →</a>
        </div>

        <div class="artwork-display">
            <div class="art-frame"><img id="detail-img" src="" alt=""></div>
            <h1 class="artwork-title" id="detail-title"></h1>
            <span class="artwork-number" id="detail-num"></span>
        </div>

        <div class="description-section">
            <h2>About This Work</h2>
            <p id="detail-desc"></p>
            <div class="medium" id="detail-medium"></div>
            <a id="detail-purchase" href="#" class="purchase-btn" target="_blank">Purchase Inquiry</a>
        </div>

        <div class="nav-links">
            <a id="detail-prev" href="#">← Previous</a>
            <a href="gallery.html">All Works</a>
            <a id="detail-next" href="#">Next →</a>
        </div>

        <div class="footer">&copy; 2026 Studio &nbsp;&mdash;&nbsp; All Rights Reserved</div>

    </div>

    <script>
        const artworks = [
            { id: 0, num: "Study I of V", title: "Study in Light & Shadow", image: "my_first.jpg", medium: "Graphite on Paper", description: "An exploration of dramatic chiaroscuro, where light carves the face from darkness. This study examines the threshold between visibility and concealment, revealing how shadow defines form as much as illumination." },
            { id: 1, num: "Study II of V", title: "Refined Structure", image: "my_second.jpg", medium: "Charcoal on Paper", description: "A meditation on underlying anatomy and the architectural framework of the human countenance. This piece distills facial structure to its essential planes and volumes, revealing the scaffolding beneath expression." },
            { id: 2, num: "Study III of V", title: "Expressive Study", image: "my_third.jpg", medium: "Graphite and Charcoal on Paper", description: "Movement captured in stillness. This work pushes beyond anatomical precision into the realm of felt emotion, where each mark carries the weight of interior life." },
            { id: 3, num: "Study IV of V", title: "Beyond Expectation", image: "my_fourth.jpg", medium: "Graphite on Paper", description: "What lies past the familiar — a face emerging from restraint into revelation. This study examines the threshold where recognition dissolves into something deeper, something unnameable." },
            { id: 4, num: "Study V of V", title: "Love & Sacrifice", image: "my_fifth.jpg", medium: "Charcoal on Paper", description: "The final study in this series confronts the twin forces that shape us — tenderness and surrender. In the economy of black and white, the deepest grays hold the most truth." }
        ];

        // Get ID from URL
        const params = new URLSearchParams(window.location.search);
        let id = parseInt(params.get('id'));

        // Fallback if no ID
        if (isNaN(id) || id < 0 || id >= artworks.length) {
            id = 0;
        }

        const art = artworks[id];

        // Populate page
        document.getElementById('detail-img').src = art.image;
        document.getElementById('detail-img').alt = art.title;
        document.getElementById('detail-title').textContent = art.title;
        document.getElementById('detail-num').textContent = art.num;
        document.getElementById('detail-desc').textContent = art.description;
        document.getElementById('detail-medium').textContent = 'Medium: ' + art.medium;

        // WhatsApp purchase link
        const phone = 'YOUR_PHONE_NUMBER';
        const msg = `Hello, I'm interested in purchasing '${art.title}' (${art.num}). Is this piece available?`;
        document.getElementById('detail-purchase').href = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;

        // Previous / Next links
        const prevLink = document.getElementById('detail-prev');
        const nextLink = document.getElementById('detail-next');

        if (id === 0) {
            prevLink.style.visibility = 'hidden';
        } else {
            prevLink.href = `detail.html?id=${id - 1}`;
        }

        if (id === artworks.length - 1) {
            nextLink.style.visibility = 'hidden';
        } else {
            nextLink.href = `detail.html?id=${id + 1}`;
        }
    </script>
</body>
</html>
