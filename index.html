<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Monochromatic Realism</title>
    <style>
        body { background-color: #7a5b5b; color: #faf6f6; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .page-container { background-color: #ffffff; max-width: 700px; width: 100%; padding: 80px 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #d0d0d0; box-sizing: border-box; text-align: center; }
        .logo-space { margin-bottom: 8px; }
        .logo-placeholder { display: inline-flex; align-items: center; justify-content: center; width: 110px; height: 110px; }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .studio-tagline { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #aaaaaa; margin-bottom: 50px; }
        .welcome-text h1 { font-size: 22px; font-weight: 300; letter-spacing: 3px; color: #111111; text-transform: uppercase; margin: 0 0 12px 0; }
        .welcome-text .divider { width: 30px; height: 1px; background: #cccccc; margin: 25px auto; }
        .welcome-text p { font-size: 13px; line-height: 1.8; color: #666666; max-width: 380px; margin: 0 auto; }
        .enter-btn { display: inline-block; margin-top: 35px; padding: 14px 40px; border: 1px solid #999999; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #444444; text-decoration: none; transition: all 0.3s ease; }
        .enter-btn:hover { background-color: #111111; color: #ffffff; border-color: #111111; }
        .footer { margin-top: 50px; font-size: 10px; letter-spacing: 2px; color: #bbbbbb; text-transform: uppercase; }
        @media (max-width: 600px) { .page-container { padding: 50px 25px; } .logo-placeholder { width: 85px; height: 85px; line-height: 85px; } .welcome-text h1 { font-size: 18px; } }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="logo-placeholder"><img src="vision-lead.png" alt="Studio Mark"></div>
        <div class="studio-tagline">JOARMANAJ</div>
        <div class="welcome-text">
            <h1>Monochromatic Realism</h1>
            <div class="divider"></div>
            <p>A studio of graphite, charcoal, and quiet intensity. The architecture of the human face — rendered in light and shadow.</p>
        </div>
        <a href="home_page.html" class="enter-btn">Enter</a>
        <div class="footer">&copy; 2026 Studio</div>
    </div>
</body>
</html>
