<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOARMANAJ | Studio</title>
    <style>
        body { background-color: #7a5b5b; color: #faf6f6; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .page-container { background-color: #ffffff; max-width: 650px; width: 100%; padding: 80px 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #d0d0d0; box-sizing: border-box; text-align: center; }

        .logo-space { margin-bottom: 10px; }
        .logo-placeholder { display: inline-flex; align-items: center; justify-content: center; width: 110px; height: 110px; }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .studio-tagline { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #aaaaaa; margin-bottom: 50px; }

        .welcome-text h1 { font-size: 22px; font-weight: 300; letter-spacing: 4px; color: #111111; text-transform: uppercase; margin: 0 0 12px 0; }
        .welcome-text .divider { width: 30px; height: 1px; background: #cccccc; margin: 25px auto; }
        .welcome-text p { font-size: 14px; line-height: 1.9; color: #555555; max-width: 380px; margin: 0 auto; }

        .enter-btn { display: inline-block; margin-top: 35px; padding: 14px 40px; background-color: #111111; color: #ffffff; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; text-decoration: none; transition: background-color 0.3s ease; }
        .enter-btn:hover { background-color: #333333; }

        .join-link { display: block; margin-top: 18px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #888888; text-decoration: none; transition: color 0.3s ease; }
        .join-link:hover { color: #111111; }

        .footer { margin-top: 50px; font-size: 10px; letter-spacing: 2px; color: #bbbbbb; text-transform: uppercase; }

        @media (max-width: 600px) {
            .page-container { padding: 50px 25px; }
            .logo-placeholder { width: 85px; height: 85px; }
            .welcome-text h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="page-container">

        <div class="logo-space">
            <div class="logo-placeholder"><img src="vision-lead.png" alt="VISION & LEAD — Studio Mark"></div>
        </div>
        <div class="studio-tagline">JOARMANAJ</div>

        <div class="welcome-text">
            <h1>The Studio</h1>
            <div class="divider"></div>
            <p>A multidisciplinary practice grounded in the hand — monochrome, surface, and intelligent systems.</p>
        </div>

        <a href="home_page.html" class="enter-btn">Enter the studio</a>
        <a href="signup.html" class="join-link">Join the Family →</a>

        <div class="footer">&copy; 2026 JOARMANAJ &nbsp;&mdash;&nbsp; All Rights Reserved</div>

    </div>
</body>
</html>
