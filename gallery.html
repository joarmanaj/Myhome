<!DOCTYPE html>

<head>

    <title>Gallery | Monochromatic Realism</title>
    <style>
        body { background-color: #7a5b5b; color: #faf6f6; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .page-container { background-color: #ffffff; max-width: 1000px; width: 100%; padding: 60px 40px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #d0d0d0; box-sizing: border-box; }
        .back-link { display: inline-block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #888888; text-decoration: none; margin-bottom: 40px; }

        .header p { font-size: 12px; letter-spacing: 4px; color: #555555; text-transform: uppercase; }

        .art-card { max-width: 400px; width: 100%; text-align: center; text-decoration: none; display: block; cursor: pointer; }

        .art-frame { background-color: #e8e8e8; padding: 12px; border: 1px solid #bbbbbb; width: 100%; box-sizing: border-box; transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        .art-frame img { width: 100%; height: auto; display: block; filter: grayscale(100%); }
        .art-title { font-size: 13px; font-style: italic; color: #444444; margin-top: 10px; letter-spacing: 1px; transition: color 0.3s ease; }
        .logo-bottom { text-align: center; margin-top: 50px; padding-top: 35px; border-top: 1px solid #cccccc; }
        .logo-placeholder {display: inline-flex; align-items: center; justify-content: center; width: 55px; height: 55px;   }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .logo-bottom .studio-tagline { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #aaaaaa; margin-top: 6px; }
        .footer { text-align: center; font-size: 10px; color: #888888; margin-top: 15px; letter-spacing: 1px; }
        @media (max-width: 600px) { .page-container { padding: 30px 15px; } .header h1 { font-size: 20px; } .art-card { max-width: 100%; } }
